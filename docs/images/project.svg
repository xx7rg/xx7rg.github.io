    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f82ff"/><stop offset="1" stop-color="#38c7b0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".25"/></filter>
