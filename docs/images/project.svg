  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="210" fill="#6d5dfb" opacity=".12"/><circle cx="150" cy="590" r="250" fill="#38c7b0" opacity=".08"/>
